<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HLI Group | Website in ontwikkeling</title><meta name="description" content="De nieuwe website van HLI Group is momenteel in ontwikkeling."><style>:root{--n:#052a5d;--d:#031b3d;--y:#fdb515;--g:#5c6672}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--n);background:#f5f7fa}.page{position:relative;display:grid;min-height:100svh;place-items:center;overflow:hidden;padding:35px 20px 70px;background:radial-gradient(circle at 50% 35%,#fff 0 25%,transparent 65%),linear-gradient(145deg,#f2f5f9,#fff 52%,#ebf0f6)}.page:before{position:absolute;inset:0;background-image:linear-gradient(rgba(5,42,93,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(5,42,93,.035) 1px,transparent 1px);background-size:62px 62px;content:'';mask-image:linear-gradient(transparent,#000 25%,#000 75%,transparent)}.content{position:relative;width:min(720px,100%);text-align:center}.logo{display:block;width:min(460px,82vw);height:auto;margin:0 auto 18px;mix-blend-mode:multiply}.line{display:flex;align-items:center;gap:12px;width:min(370px,72vw);margin:0 auto 20px}.line span{width:100%;height:1px;background:#aeb9c7}.line i{width:8px;height:8px;flex:none;background:var(--y);transform:rotate(45deg)}.label{margin:0;color:#9a6700;font-size:12px;font-weight:800;letter-spacing:.18em;text-transform:uppercase}h1{margin:10px 0;color:var(--n);font-size:clamp(34px,6vw,66px);line-height:1;letter-spacing:-.045em}.intro{margin:18px 0;color:var(--g);line-height:1.7}.dots{position:fixed;right:20px;bottom:20px;z-index:5;width:48px;height:44px;border:1px solid #c9d1dc;background:#fff;color:var(--n);font-size:21px;font-weight:800;letter-spacing:2px;cursor:pointer;box-shadow:0 8px 24px rgba(3,27,61,.1)}.dots:hover,.dots:focus{border-color:var(--y)}dialog{width:min(390px,calc(100% - 30px));padding:0;border:0;border-top:6px solid var(--y);background:#fff;color:var(--n);box-shadow:0 22px 70px rgba(3,27,61,.25)}dialog::backdrop{background:rgba(3,20,45,.72)}.modal{padding:28px}.modal h2{margin:0;font-size:24px}.modal p{margin:8px 0 20px;color:var(--g);font-size:14px}.modal label{display:block;margin-bottom:7px;font-size:13px;font-weight:800}.modal input{width:100%;padding:13px;border:1px solid #bec8d4;font:inherit}.modal-actions{display:flex;gap:10px;margin-top:16px}.modal button{min-height:44px;padding:10px 16px;border:0;font-weight:800;cursor:pointer}.submit{flex:1;border-left:5px solid var(--y)!important;background:var(--n);color:#fff}.cancel{background:#e9edf2;color:var(--n)}.error{min-height:22px;margin:9px 0 0!important;color:#b42318!important}.foot{position:absolute;bottom:20px;color:rgba(5,42,93,.55);font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}@media(max-height:700px){.logo{width:min(330px,55vh)}.page{padding-top:18px}}@media(max-width:520px){.dots{right:14px;bottom:14px}.intro br{display:none}}</style></head><body><main class="page"><section class="content"><img class="logo" src="public/hli-logo.png" alt="HLI Group"><div class="line"><span></span><i></i><span></span></div><p class="label">Binnenkort online</p><h1>Website in ontwikkeling</h1><p class="intro">We werken momenteel aan onze nieuwe website.<br>Binnenkort vindt u hier meer informatie over HLI Group.</p></section><p class="foot">Veilig · Sterk · Gecertificeerd</p></main><button class="dots" id="open" aria-label="Open websitepreview">•••</button><dialog id="gate"><form class="modal" id="gateForm"><h2>Websitepreview</h2><p>Voer het wachtwoord in om de nieuwe website te bekijken.</p><label for="password">Wachtwoord</label><input id="password" type="password" autocomplete="current-password" required><p class="error" id="error" role="alert"></p><div class="modal-actions"><button class="cancel" id="cancel" type="button">Annuleren</button><button class="submit" type="submit">Preview openen</button></div></form></dialog><script>const gate=document.querySelector('#gate'),input=document.querySelector('#password'),error=document.querySelector('#error');document.querySelector('#open').onclick=()=>{gate.showModal();setTimeout(()=>input.focus(),50)};document.querySelector('#cancel').onclick=()=>gate.close();document.querySelector('#gateForm').onsubmit=async e=>{e.preventDefault();const data=new TextEncoder().encode(input.value);const digest=await crypto.subtle.digest('SHA-256',data);const hash=[...new Uint8Array(digest)].map(b=>b.toString(16).padStart(2,'0')).join('');if(hash==='8bf555c322c426fcc38be69d630af07372835d07484ff06d5772eca51fea0840'){sessionStorage.setItem('hli-preview','granted');location.href='preview/index.html'}else{error.textContent='Onjuist wachtwoord.';input.select()}};</script></body></html>
