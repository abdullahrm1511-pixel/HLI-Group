<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HLI Group | Website Under Construction</title>
  <meta name="description" content="De nieuwe website van HLI Holland Load & Inspection Group is momenteel in ontwikkeling.">
  <style>
    :root{--navy:#05295c;--gold:#ffb500;--slate:#59616b}*{box-sizing:border-box}html,body{min-height:100%;margin:0}body{font-family:Arial,Helvetica,sans-serif;color:var(--navy)}main{position:relative;isolation:isolate;display:grid;min-height:100svh;place-items:center;overflow:hidden;padding:clamp(2rem,6vw,5rem) 1.25rem 4rem;background:radial-gradient(circle at 50% 38%,rgba(255,255,255,.96) 0 24%,transparent 60%),linear-gradient(145deg,#f3f6fb 0%,#fff 48%,#eef3f8 100%)}main:before{position:absolute;z-index:-2;inset:0;background-image:linear-gradient(rgba(5,41,92,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(5,41,92,.03) 1px,transparent 1px);background-size:64px 64px;content:""}.ambient{position:absolute;z-index:-1;width:28rem;height:28rem;border-radius:999px;opacity:.6}.left{bottom:-19rem;left:-13rem;border:5rem solid rgba(5,41,92,.07)}.right{top:-20rem;right:-14rem;border:5rem solid rgba(255,181,0,.11)}section{width:min(760px,100%);text-align:center;animation:arrive .7s cubic-bezier(.22,1,.36,1) both}.logo{width:min(480px,85vw);margin:0 auto clamp(1.3rem,4vw,2.25rem)}.logo img{display:block;width:100%;height:auto;mix-blend-mode:multiply}.divider{display:flex;align-items:center;gap:.8rem;width:min(390px,72vw);margin:0 auto 1.4rem}.divider span{width:100%;height:1px;background:linear-gradient(90deg,transparent,rgba(5,41,92,.4))}.divider span:last-child{background:linear-gradient(90deg,rgba(5,41,92,.4),transparent)}.divider i{flex:0 0 auto;width:8px;height:8px;background:var(--gold);transform:rotate(45deg)}.eyebrow{margin:0 0 .65rem;color:var(--gold);font-size:.76rem;font-weight:700;letter-spacing:.24em;text-transform:uppercase}h1{margin:0;font-size:clamp(2rem,6vw,4.5rem);letter-spacing:-.045em;line-height:1.02}.intro{margin:1.3rem auto 0;color:var(--slate);font-size:clamp(.95rem,2vw,1.1rem);line-height:1.75}footer{position:absolute;bottom:1.4rem;left:50%;width:100%;transform:translateX(-50%);color:rgba(5,41,92,.54);font-size:.68rem;font-weight:700;letter-spacing:.24em;text-align:center;text-transform:uppercase}footer b{color:var(--gold)}@keyframes arrive{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}@media(max-height:720px){main{padding-block:1.5rem 3.5rem}.logo{width:min(350px,64vh);margin-bottom:.75rem}.divider{margin-bottom:.85rem}.intro{margin-top:.8rem}}@media(prefers-reduced-motion:reduce){section{animation:none}}
  </style>
</head>
<body>
  <main>
    <div class="ambient left" aria-hidden="true"></div><div class="ambient right" aria-hidden="true"></div>
    <section aria-labelledby="title">
      <div class="logo"><img src="public/hli-logo.png" alt="HLI Holland Load & Inspection Group — Testing, Inspection, Certification"></div>
      <div class="divider" aria-hidden="true"><span></span><i></i><span></span></div>
      <p class="eyebrow">Binnenkort online</p>
      <h1 id="title">Website Under Construction</h1>
      <p class="intro">We werken momenteel aan onze nieuwe website.<br>Binnenkort vindt u hier meer informatie over HLI Group.</p>
    </section>
    <footer>Safe <b>•</b> Strong <b>•</b> Certified</footer>
  </main>
</body>
</html>
